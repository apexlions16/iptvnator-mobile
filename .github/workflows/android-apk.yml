name: Android APK Oluştur

on:
  push:
    branches:
      - master
      - 'agent/**'
    paths:
      - 'apps/mobile-android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'apps/mobile-android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ve-apk:
    name: Test ve debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android 35 paketlerini yükle
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Birim testlerini çalıştır
        run: gradle -p apps/mobile-android testDebugUnitTest --stacktrace

      - name: Debug APK oluştur
        run: gradle -p apps/mobile-android assembleDebug --stacktrace

      - name: APK dosyasını yayımla
        uses: actions/upload-artifact@v4
        with:
          name: cep-iptv-debug-apk
          path: apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
